name: CI

on:
  push:
    branches: [August-Development, Ariyan-Dev]
  pull_request:
    branches: [August-Development, Ariyan-Dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      MONGO_URI: mongodb://localhost:27017/pawtato-test
      JWT_SECRET: ci-test-jwt-secret-please-change
      JWT_EXPIRES: 1d
      REFRESH_SECRET: ci-test-refresh-secret-change
      REFRESH_EXPIRES: 7d

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build

      - name: Unit tests with coverage
        run: npm run test:cov -- --ci

      - name: E2E tests
        run: npm run test:e2e -- --ci

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pawtato-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote-to-august-development:
    name: Promote Ariyan-Dev to August-Development
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/Ariyan-Dev'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: August-Development
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge Ariyan-Dev into August-Development
        run: |
          git fetch origin Ariyan-Dev
          git merge --no-ff origin/Ariyan-Dev -m "chore: auto-merge Ariyan-Dev into August-Development [ci]"
          git push origin August-Development
